
<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tia Susu - Desenvolvimento Infantil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Prevenir erro de 'process is not defined' que causa tela branca
        window.process = window.process || { env: {} };
        
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                'susu-blue': '#1E88E5',
                'susu-pink': '#EC407A', 
                'susu-yellow': '#FBC02D',
                'pastel-blue': '#E3F2FD',
                'pastel-pink': '#FCE4EC',
                'pastel-yellow': '#FFFDE7',
              },
              fontFamily: {
                fredoka: ['Fredoka', 'sans-serif'],
                quicksand: ['Quicksand', 'sans-serif'],
              },
              animation: {
                'float': 'float 6s ease-in-out infinite',
                'bounce-slow': 'bounce 3s infinite',
              }
            }
          }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
          html {
            scroll-behavior: smooth;
          }
          body {
            @apply font-quicksand bg-white text-gray-800 antialiased;
          }
          h1, h2, h3, h4 {
            @apply font-fredoka;
          }
        }

        @keyframes float {
          0% { transform: translateY(0px) rotate(0deg); }
          50% { transform: translateY(-15px) rotate(1deg); }
          100% { transform: translateY(0px) rotate(0deg); }
        }

        .custom-scrollbar::-webkit-scrollbar {
          width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
          background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          @apply bg-gray-200 rounded-full;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "./App": "./App.tsx",
    "./constants": "./constants.tsx",
    "./geminiService": "./geminiService.ts"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <!-- Script de entrada crucial para evitar tela branca -->
    <script type="module" src="index.tsx"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
